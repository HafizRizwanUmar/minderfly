# Nginx Site Config for minderfly.com
# File: /etc/nginx/sites-available/minderfly.com
# After editing: sudo ln -s /etc/nginx/sites-available/minderfly.com /etc/nginx/sites-enabled/
#                sudo nginx -t && sudo systemctl reload nginx

# Redirect www → non-www (HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name www.minderfly.com;
    return 301 https://www.minderfly.com$request_uri;
}

# Redirect HTTP → HTTPS (non-www)
server {
    listen 80;
    listen [::]:80;
    server_name minderfly.com;
    return 301 https://www.minderfly.com$request_uri;
}

# Redirect www → non-www (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.minderfly.com;

    ssl_certificate     /etc/letsencrypt/live/minderfly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minderfly.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.minderfly.com$request_uri;
}

# Main HTTPS Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name minderfly.com;

    ssl_certificate     /etc/letsencrypt/live/minderfly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minderfly.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ─── Enforce No Trailing Slash ────────────────────────────
    rewrite ^/(.*)/$ /$1 permanent;

    # Document root = Vite build output
    root /var/www/minderfly/dist;
    index index.html;

    # ─── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ─── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Cache Rules ───────────────────────────────────────────
    # Immutable hashed assets (JS/CSS with contenthash) — cache 1 year
    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images — cache 30 days
    location ~* \.(png|jpe?g|gif|webp|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # robots.txt & sitemap — short cache, always fresh
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ─── SPA Fallback Routing ─────────────────────────────────
    # All routes fall back to index.html for React Router to handle
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    # ─── Deny hidden files ────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # ─── Access Logs ──────────────────────────────────────────
    access_log /var/log/nginx/minderfly.access.log;
    error_log  /var/log/nginx/minderfly.error.log;
}
